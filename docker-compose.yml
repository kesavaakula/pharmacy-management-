version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pharmacy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pharmacy_db
      POSTGRES_USER: pharmacy
      POSTGRES_PASSWORD: pharmacy123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./apps/backend
    container_name: pharmacy-backend
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pharmacy_db
      SPRING_DATASOURCE_USERNAME: pharmacy
      SPRING_DATASOURCE_PASSWORD: pharmacy123
      SERVER_PORT: 8081
    ports:
      - "8081:8081"

  frontend:
    build:
      context: ./apps/frontend
    container_name: pharmacy-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:

server:
  port: ${PORT:8081}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:${JDBC_DATABASE_URL:jdbc:h2:file:./data/pharmacy_db;MODE=PostgreSQL;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:sa}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:${DATABASE_DRIVER_CLASS_NAME:org.h2.Driver}}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: ${HIBERNATE_DIALECT:${DATABASE_DIALECT:org.hibernate.dialect.H2Dialect}}
  sql:
    init:
      mode: always

jwt:
  secret: ${JWT_SECRET:PharmacySecretKeyForSecureInventorySystem2026}
  expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health, info

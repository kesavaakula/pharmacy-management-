server:
  port: ${PORT:8081}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/pharmacy}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:postgres}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:${DATABASE_DRIVER_CLASS_NAME:org.postgresql.Driver}}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: ${HIBERNATE_DIALECT:${DATABASE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}}
  sql:
    init:
      mode: always

app:
  demo-data: ${APP_DEMO_DATA:true}

jwt:
  secret: ${JWT_SECRET:PharmacySecretKeyForSecureInventorySystem2026}
  expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health, info
